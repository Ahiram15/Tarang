services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tarang-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - AISSTREAM_API_KEY=${AISSTREAM_API_KEY:-}
      - CDSE_CLIENT_ID=${CDSE_CLIENT_ID:-}
      - CDSE_CLIENT_SECRET=${CDSE_CLIENT_SECRET:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-alerts@tarang-sentinel.gov}
    volumes:
      - ./backend/data:/app/backend/data
    networks:
      - tarang-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tarang-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - tarang-net

networks:
  tarang-net:
    driver: bridge
